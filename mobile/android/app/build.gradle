apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Signing material never lives in the repo.  See keystore.properties.example.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace "cn.motioncontrol.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        // x86 builds exist only for emulators; every real device here is ARM,
        // and the two Vosk libraries cost 18 MB.
        ndk {
            // 只发 64 位。armeabi-v7a 里最大的一块是 libvosk.so 的 7.9 MB，而
            // 32 位的安卓机 2015 年以后就没有了，谷歌从 2019 年起也强制要求 64 位。
            abiFilters 'arm64-v8a'
        }
        applicationId "cn.motioncontrol.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // APK 的版本号只写一遍，versionCode 从它算出来。两个数字手工同步的话，
        // 总有一次会改了一个忘了另一个，而 versionCode 只能往上走、不能重用，
        // 错了就是一个装不上去的包。编码是 MAJOR*10000 + MINOR*100 + PATCH，
        // 这样整数自己读得出来（1.2.3 -> 10203）。
        //
        // 网页包有它自己的版本号，在 mobile/package.json，和这一个故意分开：
        // 它能热更，而 APK 不会跟着变。
        versionName "2.1.1"
        versionCode versionName.tokenize('.').with { p ->
            p[0].toInteger() * 10000 + p[1].toInteger() * 100 + p[2].toInteger()
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
            noCompress 'onnx'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : null
            // R8 is left off for now: Capacitor, JNA and Vosk all need hand-written
            // keep rules, and getting that wrong fails at runtime rather than at
            // build time.  Not a release blocker; revisit in a 2.0.x.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

afterEvaluate {
    tasks.withType(JavaCompile) {
        sourceCompatibility = "17"
        targetCompatibility = "17"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Keystore-backed storage for the pairing secret.  Not localStorage:
    // that is plain app storage and the secret is a credential.
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "com.alphacephei:vosk-android:0.3.47@aar"
    implementation "net.java.dev.jna:jna:5.13.0@aar"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// An unsigned release APK installs nowhere useful and is easy to ship by
// accident -- that is exactly how the 2.0 candidate ended up carrying the
// Android debug key.  Fail before anything is built rather than after:
// taskGraph.whenReady runs once configuration is done and before the first
// task executes, so this costs seconds instead of a full compile.
gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { it.name in ["assembleRelease", "bundleRelease"] }
    if (wantsRelease && !keystorePropertiesFile.exists()) {
        throw new GradleException(
            "缺少 android/keystore.properties：Release 构建必须使用正式签名密钥。" +
            " 请参考 android/keystore.properties.example 生成并配置密钥库。")
    }
}
