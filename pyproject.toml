[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motionbridge"
version = "0.4.3"
description = "MotionBridge single-camera motion game controller"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "vosk>=0.3.45",
    "qrcode>=7.4",
    "websockets>=12",
    "pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyinstaller>=6",
]
package = [
    "pyinstaller>=6",
]

[project.scripts]
motionbridge = "motionbridge.cli:main"
